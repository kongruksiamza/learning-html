<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <form method="GET">
        <p>คุณใช้เครื่องมือใดบ้างในการพัฒนาเว็บไซต์ ?</p>
        <input type="checkbox" name="tool1" id="tool1" value="html" checked>
        <label for="tool1">HTML</label><br>
        <input type="checkbox" name="tool2" id="tool2" value="css" checked>
        <label for="tool2">CSS</label><br>
        <input type="checkbox" name="tool3" id="tool3" value="js">
        <label for="tool3">JavaScript</label><br>
        <input type="checkbox" name="tool4" id="tool4" value="php" disabled>
        <label for="tool4">PHP</label><br>
        <br>
        <button type="submit">บันทึก</button>
        <button type="reset">ยกเลิก</button>
    </form>
</body>
</html>
