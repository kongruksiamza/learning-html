<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio / Video</title>
</head>
<body>
    <!-- audio -->
     <audio 
        src="sound/voice.mp3"
        controls
        autoplay
        muted
    ></audio>

    <hr>
    <!-- video -->

    <video 
        src="video/video.mp4"
        width="400"
        height="200"
        controls
        poster="video/cover.png"
    ></video>

</body>
</html>
