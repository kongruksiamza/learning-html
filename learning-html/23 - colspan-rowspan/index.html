<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan & Rowspan</title>
    <style>
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse;
        }

        td{
            text-align: center;
        }
    </style>
</head>
<body>
    <table style="width: 50%;">
        <caption>ตารางแสดงการสั่งซื้อสินค้า</caption>
        <thead>
            <tr>
                <th>ชื่อสินค้า</th>
                <th>ขนาด</th>
                <th>ราคา</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">เสื้อ</td>
                <td>L</td>
                <td>500</td>
            </tr>
            <tr>
                <td>XL</td>
                <td>700</td>
            </tr>
            <tr>
                <td>กางเกง</td>
                <td>M</td>
                <td>500</td>
            </tr>
            <tr>
                <td colspan="2">กระเป๋า</td>
                <td>300</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">รวมทั้งหมด : 2,000 บาท</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
