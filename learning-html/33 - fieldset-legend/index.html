<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset & Legend</title>
</head>

<body>
    <h2>แบบฟอร์มสมัครงาน</h2>
    <form method="GET">
        <fieldset>
            <legend>ข้อมูลพื้นฐาน</legend>
            <label for="fname">ชื่อ:</label><br>
            <input type="text" name="firstname" id="fname"><br>
            <label for="lname">นามสกุล:</label><br>
            <input type="text" name="lastname" id="lname"><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>ปุ่มดำเนินการ</legend>
            <button type="submit">บันทึก</button>
            <button type="reset">ยกเลิก</button>
        </fieldset>
    </form>
</body>

</html>
