<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation</title>
</head>
<body>
    <!-- blockquote -->
     <blockquote cite="https://html.spec.whatwg.org/multipage/">
        <p> 
            HTML (Living Standard) <br>
            เป็นมาตรฐานล่าสุดของภาษา HTML <br>
            (Last Updated 11 August 2026)
        </p>
    </blockquote>
    <p>แหล่งที่มา : <cite>whatwg.org</cite></p>
    <hr>

    <!-- quote -->
    <p>อัลเบิร์ต ไอน์สไตน์ กล่าวว่า 
        <q cite="https://en.wikipedia.org/wiki/Albert_Einstein">
            จินตนาการสำคัญกว่าความรู้
        </q>
    </p>
    <p>แหล่งที่มา : <cite>วิกีพีเดีย</cite></p>
    <hr>
    <!-- abbr -->
    <abbr title="HyperText Markup Language">HTML</abbr><br>
    <abbr title="กรุงเทพมหานคร">กทม</abbr><br>
    <abbr title="Application Programming Interface">API</abbr>
</body>
</html>
