<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Attributes</title>
</head>

<body>
    <h2>แบบฟอร์มสมัครงาน</h2>
    <form method="GET">
        <fieldset>
            <legend>ข้อมูลพื้นฐาน</legend>
            <!-- ชื่อ -->
            <label for="fname">ชื่อ:</label><br>
            <input type="text" 
                name="firstname" 
                id="fname" 
                placeholder="ไม่ต้องระบุคำนำหน้า"
                value="admin"
                autofocus
                readonly
                required><br>
            <!-- นามสกุล -->
            <label for="lname">นามสกุล:</label><br>
            <input type="text" name="lastname" 
                id="lname" 
                placeholder="ป้อนนามสกุลของคุณ"
                value="ruksiam" 
                required><br>
            <!-- ที่อยู่ -->
            <label for="address">ที่อยู่:</label><br>
            <textarea 
                name="address" 
                rows="5" 
                cols="30" 
                placeholder="ป้อนที่อยู่ของคุณ" 
                required
                maxlength="5"
                id="address">กรุงเทพมหานคร</textarea>
        </fieldset>
        <br>
        <fieldset>
            <legend>ข้อมูลแบบพิเศษ</legend>
            <!-- email -->
            <label for="email">อีเมล:</label><br>
            <input type="email" 
                name="email" 
                placeholder="example@email.com"
                value="admin@email.com"
                required
                id="email"><br>
            <!-- password -->
            <label for="password">รหัสผ่าน:</label><br>
            <input type="password" 
                name="password" 
                id="password"
                minlength="5"
                maxlength="10"
                value="12345"
                required
                ><br>
            <!-- birthdate -->
            <label for="birthdate">วันเกิด:</label><br>
            <input type="date" name="birthdate" id="birthdate"><br>
            <!-- time -->
            <label for="time">เวลา:</label><br>
            <input type="time" name="time" id="time"><br>
            <!-- number -->
            <label for="age">อายุ (ปี):</label><br>
            <input type="number" 
                name="age" 
                id="age" 
                value="26"
                step="2"
                max="40"
                min="18"
                ><br>
            <!-- telephone -->
            <label for="telephone">เบอร์ติดต่อ:</label><br>
            <input type="tel" 
                name="telephone" 
                placeholder="087-654-3210(ไม่บังคับ)"
                id="telephone"><br>
            <!-- website -->
            <label for="website">เว็บไซต์:</label><br>
            <input type="url" 
                name="website" 
                id="website"
                required
                placeholder="ป้อนเว็บไซต์ของคุณ"
                ><br>
            <!-- color -->
            <label for="color">สีที่ชอบ:</label><br>
            <input type="color" name="color" id="color" value="yellow"><br>
            <!-- slider -->
            <label for="salary">เงินเดือน:</label><br>
            <input type="range" 
                    name="salary" 
                    id="salary"
                    min="18000"
                    value="20000"
                    max="50000"
                    ><br>
            <!-- hidden -->
            <input type="hidden" name="empID" value="EMP001">
            <!-- week -->
            <label for="week">สัปดาห์:</label><br>
            <input type="week" name="week" id="week"><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>ปุ่มดำเนินการ</legend>
            <button type="submit" disabled>บันทึก</button>
            <button type="reset">ยกเลิก</button>
        </fieldset>
    </form>
</body>

</html>
