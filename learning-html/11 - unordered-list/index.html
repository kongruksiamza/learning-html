<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <h2>🍎ผลไม้ที่ชอบ 🍌</h2>
    
    <!-- รายการแบบไม่เรียงลำดับ -->
    <ul style="list-style-type: none;">
        <li>แอปเปิ้ล</li>
        <li>มะละกอ</li>
        <li>ส้ม</li>
        <li>กล้วย</li>
    </ul>

    <hr>

    <!-- disc -->
    <ul style="list-style-type: disc;">
        <li>แอปเปิ้ล</li>
        <li>มะละกอ</li>
        <li>ส้ม</li>
        <li>กล้วย</li>
    </ul>

    <hr>

    <!-- circle -->
    <ul style="list-style-type: circle;">
        <li>แอปเปิ้ล</li>
        <li>มะละกอ</li>
        <li>ส้ม</li>
        <li>กล้วย</li>
    </ul>

    <hr>
    <!-- square -->
    <ul style="list-style-type: square;">
        <li>แอปเปิ้ล</li>
        <li>มะละกอ</li>
        <li>ส้ม</li>
        <li>กล้วย</li>
    </ul>
</body>
</html>
