<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID / Class</title>
    <style>
        #title{
            color: red;
        }
        .text{
            color: green;
        }
        .highlight{
            background-color: black;
        }
    </style>
</head>
<body>
    <!-- ID -->
    <h1 id="title" class="highlight">Heading 1</h1>
    <h1>Heading 2</h1>

    <hr>
    <!-- Class -->
    <h1 class="text">Heading 3</h1>
    <h2 class="text">Sub-title</h2>
    <p class="text highlight">Lorem ipsum dolor sit amet.</p>

    <!-- emmet id = # , class = . -->
    <h4 id="title-demo">Lorem, ipsum.</h4>
    <p class="text highlight">KongRuksiam</p>
</body>
</html>
